name: ingest-law
on:
  push:
    branches: [main]
    paths: ["scripts/**", "sources.json", "source-publication.json", ".github/workflows/ingest-law.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isolated-law-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}/toolkit/intelligence:${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/checkout@v4
        with:
          repository: bartimoussmith-oss/civic-newsroom
          ref: 18efc5218131792fb311493d4678b700c4d8d71a
          path: toolkit
          persist-credentials: false
          sparse-checkout: intelligence
      - uses: actions/checkout@v4
        with:
          repository: bartimoussmith-oss/civic-newsroom-data-001
          ref: 2465245db04551c42f748a85fc151b869d246649
          path: source-data
          persist-credentials: false
          sparse-checkout: datasets/build-40279333802
      - name: Prepare isolated runtime and pinned local descriptor
        run: |
          test "$GITHUB_REPOSITORY" = 'bartimoussmith-oss/civic-newsroom-law-001'
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          cp source-publication.json source-data/published.json
      - name: Test extraction and integrity guards
        id: tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Ingest full primary files and audit pinned archive citations
        id: build
        run: python scripts/legal_build.py build --dataset-repo source-data --out /tmp/law-build > legal-build-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-law-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            legal-build-result.json
            /tmp/law-build/public/collection.json
            /tmp/law-build/public/acquisition-gaps.json
          retention-days: 7
      - name: Publish only to the dedicated law repository
        id: publication
        run: python scripts/legal_build.py publish --out /tmp/law-build
      - name: Record isolated ingestion result
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          PUBLICATION_RESULT: ${{ steps.publication.outcome }}
        with:
          script: |
            const owner='bartimoussmith-oss',repo='civic-newsroom-law-001';
            if(context.repo.owner!==owner||context.repo.repo!==repo)throw Error('Wrong status target');
            const report={schema:'isolated-law-status-v1',revision:context.sha,run_id:context.runId,tests:process.env.TEST_RESULT,build:process.env.BUILD_RESULT,publication:process.env.PUBLICATION_RESULT,checked_at:new Date().toISOString(),existing_repositories_modified:false,website_deployed:false,complete_legal_coverage:false};
            const path='status/build.json';let old;try{old=await github.rest.repos.getContent({owner,repo,path,ref:'main'});}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'status: isolated legal ingestion '+context.runId,content:Buffer.from(JSON.stringify(report,null,2)).toString('base64'),...(old?{sha:old.data.sha}:{})});
